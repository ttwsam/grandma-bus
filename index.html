<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶奶的公交</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: a thin "navigating from <street>" bar up top (live
   reverse-geocoded from her actual position), then two always-visible
   route panels (30 and 51A, closest first), each with its stop name
   and a horizontally scrollable row of big arrival tiles — no vertical
   list, no destination text, since from home she only ever travels one
   way. A big labeled button at the bottom re-checks her location. */
:root{
  --bg:#FAF8F4;
  --fg:#15181D;
  --surface:#FFFFFF;
  --surface-edge:#E4E0D8;
  --tile-bg:#F3EFE6;
  --muted:#5B6269;
  --accent-30:#0B5FA5;
  --accent-51a:#C8102E;
  --good:#1B8A5A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;
    --fg:#F2F1EC;
    --surface:#181C22;
    --surface-edge:#2A2F37;
    --tile-bg:#20262E;
    --muted:#9AA3AF;
    --accent-30:#5B9BD9;
    --accent-51a:#FF6B6B;
    --good:#4CC38A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116;
  --fg:#F2F1EC;
  --surface:#181C22;
  --surface-edge:#2A2F37;
  --tile-bg:#20262E;
  --muted:#9AA3AF;
  --accent-30:#5B9BD9;
  --accent-51a:#FF6B6B;
  --good:#4CC38A;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100%;
  min-height:100dvh;
  background:var(--bg);
  color:var(--fg);
  font-family:"Noto Sans SC","Inter",system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:12px;
  gap:8px;
  overflow-x:hidden;
}
.page-header{
  display:flex;
  flex-direction:column;
  gap:1px;
  padding:0 2px;
}
.page-title-zh{
  font-size:clamp(15px, 2.1dvh, 19px);
  font-weight:700;
  margin:0;
  line-height:1.25;
}
.page-title-en{
  font-size:clamp(11px, 1.55dvh, 13px);
  font-weight:500;
  color:var(--muted);
  margin:0;
  line-height:1.25;
}
.location-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:5px;
}
.location-row svg{flex:none;width:clamp(15px, 2dvh, 17px);height:clamp(15px, 2dvh, 17px);color:var(--accent-30);}
.location-row span{
  font-size:clamp(12.5px, 1.7dvh, 14px);
  font-weight:500;
  color:var(--muted);
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.panels{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.panel{
  background:var(--surface);
  border:1px solid var(--surface-edge);
  border-radius:18px;
  padding:12px 12px 10px 12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.panel-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:7px;
  border-bottom:1px solid var(--surface-edge);
}
.route-badge{
  flex:none;
  width:clamp(44px, 6dvh, 52px);
  height:clamp(44px, 6dvh, 52px);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(15px, 2dvh, 17px);
  font-weight:900;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
.route-badge.r30{background:var(--accent-30);}
.route-badge.r51A{background:var(--accent-51a);}
.panel-location{min-width:0;}
.stop-name{
  font-size:clamp(15px, 2dvh, 17px);
  font-weight:700;
  margin:0 0 1px 0;
  line-height:1.2;
  text-wrap:balance;
}
.stop-meta{
  font-size:clamp(11.5px, 1.55dvh, 12.5px);
  color:var(--muted);
  margin:0;
  line-height:1.2;
}
.times-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 1px 3px 1px;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.time-tile{
  flex:none;
  scroll-snap-align:start;
  min-width:clamp(72px, 10dvh, 86px);
  background:var(--tile-bg);
  border-radius:13px;
  padding:9px 6px;
  text-align:center;
}
.tile-mins{
  font-size:clamp(26px, 3.7dvh, 32px);
  font-weight:900;
  line-height:1;
  font-variant-numeric:tabular-nums;
  margin:0;
}
.tile-mins.soon{color:var(--good);}
.tile-mins .unit{
  display:block;
  font-size:clamp(10.5px, 1.4dvh, 12px);
  font-weight:500;
  color:var(--muted);
  margin-top:2px;
}
.tile-clock{
  font-size:clamp(11px, 1.5dvh, 13px);
  color:var(--muted);
  margin:5px 0 0 0;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.panel-state{
  padding:10px 0 4px 0;
  font-size:clamp(13px, 1.75dvh, 14.5px);
  color:var(--muted);
  text-align:center;
}
.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid var(--surface-edge);
  border-top-color:var(--accent-30);
  animation:spin 1s linear infinite;
  margin:0 auto 7px auto;
}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2.4s;}}
@keyframes spin{to{transform:rotate(360deg);}}
.bottom-bar{
  flex:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding-top:0;
}
.status-line{
  font-size:clamp(10.5px, 1.4dvh, 12px);
  color:var(--muted);
  text-align:center;
}
.refresh-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent-30);
  color:#fff;
  border:none;
  border-radius:13px;
  padding:12px 16px;
  font-size:clamp(15.5px, 2.1dvh, 17px);
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
}
.refresh-btn:active{transform:scale(0.98);}
.refresh-btn svg{width:19px;height:19px;flex:none;}
.refresh-btn.spinning svg{animation:spin 0.9s linear infinite;}
</style>
</head>
<body>

<div class="page-header">
  <p class="page-title-zh">嫲嫲嘅巴士時間表</p>
  <p class="page-title-en">Grandma's Bus Schedule</p>
  <div class="location-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4 4.6 20.3l.9.9L12 18l6.5 3.2.9-.9z"/></svg>
    <span id="locationText">正在定位…</span>
  </div>
</div>

<div class="panels" id="panels">
  <div class="panel">
    <div class="panel-state">
      <div class="spinner"></div>
      正在定位,查找附近的公交站…
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span class="status-line" id="statusLine">&nbsp;</span>
  <button class="refresh-btn" id="refreshBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    刷新位置
  </button>
</div>

<script>
(function(){

  // ---- Her saved stops ------------------------------------------------
  // Coordinates are geocoded directly from each cross street via
  // OpenStreetMap — accurate to the intersection, not hand-estimated.
  // Still worth a field check by standing at each one with the page
  // open, since geocoding can occasionally land on the wrong corner.
  // "name" is the plain stop name shown in the UI — no nickname prefix.
  var STOPS = [
    {
      id: '52969',           // Home stop
      name: 'Otis Dr & Larchmont Isle',
      lat: 37.7652424, lon: -122.2677706,
      routes: ['30']
    },
    {
      id: '51478',           // Alameda dim sum stop
      name: 'Webster St & Buena Vista Av',
      lat: 37.7770532, lon: -122.2767592,
      routes: ['30', '51A']
    },
    {
      id: '50237',           // Oakland Chinatown stop
      name: 'Harrison St & 8th St',
      lat: 37.7990508, lon: -122.2699070,
      routes: ['30', '51A']
    },
    {
      id: '50300',           // Trader Joe's / South Shore stop
      name: 'South Shore Center & Kohl\'s',
      lat: 37.7574566, lon: -122.2513933,
      routes: ['30']
    }
  ];

  var ROUTES = ['30', '51A'];
  var API_KEY = 'fd6090cc-eb13-46f8-86c3-2c4ffb0ee3e6';
  // Confirmed live (via direct browser fetch, Nov 2026): api.511.org's
  // StopMonitoring endpoint sends proper CORS headers, so no proxy is
  // needed for it. An earlier version of this page routed failed calls
  // through a public CORS proxy (api.allorigins.win) as a fallback --
  // that proxy turned out to be extremely slow/unreliable (19s+, often
  // failing outright) and was the main cause of multi-second load times.
  // Removed entirely: a failed direct call now just shows the "can't
  // connect" message right away instead of hanging on a bad proxy.

  // 511.org's default API key limit is 60 requests/hour (confirmed via
  // their open-data FAQ). Each refresh cycle calls StopMonitoring once
  // per DISTINCT stop needed (usually 2: one per route, occasionally 1
  // if both routes share a stop). At 150s between refreshes that's at
  // most 24 cycles/hour x 2 = 48 requests/hour, leaving headroom under
  // the limit for manual "刷新位置" taps too. Do not drop this much
  // below 150000 without also re-checking the math.
  var REFRESH_MS = 150000;

  // ---- TEST OVERRIDE ---------------------------------------------------
  // Set to a {lat, lon} object to pretend she is standing somewhere
  // specific (useful for bench-testing). null means use real GPS, which
  // is what should be live on her actual phone.
  var TEST_LOCATION_OVERRIDE = null;

  var state = { entries: null, timer: null };

  var els = {
    locationText: document.getElementById('locationText'),
    panels: document.getElementById('panels'),
    statusLine: document.getElementById('statusLine'),
    refreshBtn: document.getElementById('refreshBtn')
  };

  function haversineMeters(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function nearestStopForRoute(route, lat, lon){
    var candidates = STOPS.filter(function(s){ return s.routes.indexOf(route) !== -1; });
    var best = null, bestDist = Infinity;
    candidates.forEach(function(s){
      var d = haversineMeters(lat, lon, s.lat, s.lon);
      if (d < bestDist){ bestDist = d; best = s; }
    });
    return { stop: best, distanceM: bestDist };
  }

  // Reverse-geocodes the viewer's live coordinates to a plain street
  // name, so the top bar always reflects wherever she actually is
  // (not just whichever saved stop is nearest).
  function reverseGeocodeStreet(lat, lon){
    var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' +
              lat + '&lon=' + lon + '&zoom=16&addressdetails=1';
    return fetch(url, { headers: { 'Accept': 'application/json' } })
      .then(function(r){
        if (!r.ok) throw new Error('reverse geocode http ' + r.status);
        return r.json();
      })
      .then(function(data){
        var addr = data.address || {};
        return addr.road || addr.pedestrian || addr.neighbourhood ||
               (data.display_name ? data.display_name.split(',')[0] : null);
      });
  }

  function updateLocationText(lat, lon){
    els.locationText.textContent = '正在确认街道…';
    reverseGeocodeStreet(lat, lon)
      .then(function(street){
        els.locationText.textContent = street ? ('从 ' + street + ' 出发') : '位置已更新';
      })
      .catch(function(){
        els.locationText.textContent = '位置已更新';
      });
  }

  function fieldValue(v){
    if (Array.isArray(v)) v = v[0];
    if (v && typeof v === 'object') return v.value || v._ || '';
    return v || '';
  }

  function extractVisits(data){
    var siri = data.Siri || data;
    var sd = siri.ServiceDelivery || {};
    var smd = sd.StopMonitoringDelivery;
    if (Array.isArray(smd)) smd = smd[0];
    if (!smd) return [];
    var visits = smd.MonitoredStopVisit;
    if (!visits) return [];
    return Array.isArray(visits) ? visits : [visits];
  }

  function parseArrivals(data){
    var visits = extractVisits(data);
    var now = Date.now();
    var out = [];
    visits.forEach(function(v){
      var mvj = v.MonitoredVehicleJourney || {};
      // LineRef holds the route number ("30", "51A"); PublishedLineName
      // holds the route's full descriptive name ("Dimond - Fruitvale -
      // South Shore"), which is never empty and so must not be checked
      // first or it always wins and nothing ever matches our routes.
      var line = fieldValue(mvj.LineRef) || fieldValue(mvj.PublishedLineName);
      line = String(line).trim();
      if (ROUTES.indexOf(line) === -1) return;
      var call = mvj.MonitoredCall || {};
      var when = call.ExpectedArrivalTime || call.AimedArrivalTime || call.ExpectedDepartureTime;
      if (!when) return;
      var t = new Date(when).getTime();
      if (isNaN(t) || t < now) return;
      out.push({ line: line, time: t });
    });
    out.sort(function(a,b){ return a.time - b.time; });
    return out;
  }

  // ---- Scheduled backfill (beyond live tracking) -----------------------
  // StopMonitoring only reports buses currently out on the road -- often
  // just 1-2 per route, especially in the evening. To show up to 8, and
  // to roll into tomorrow once today's service ends, we backfill with
  // the real published schedule.
  //
  // We tried 511.org's live "stoptimetable" API for this first, but it
  // turned out to be broken server-side: every request to it returns
  // HTTP 412 ("Precondition set by the client failed"), even using the
  // exact example from 511's own API spec PDF -- confirmed by testing
  // directly in a browser. Falling back to a public CORS proxy when
  // that failed was *also* what caused the 19+ second load times (the
  // proxy is extremely slow and often fails outright). Both are gone.
  //
  // Instead, the schedule below was extracted ONCE from AC Transit's
  // own published GTFS feed (api.511.org/transit/datafeeds, operator
  // AC) on 2026-11-13, for exactly these 4 stops and 2 routes --
  // combining calendar.txt (which days each trip runs) with
  // stop_times.txt (the actual stop-level arrival times, not just the
  // handful of "timepoints" the live timetable API exposes). It is
  // static data baked into the page, so showing it costs zero extra
  // network requests and zero extra load time.
  //
  // SCHEDULE[stopId][routeId] is an array of 7 day-arrays, indexed like
  // JS Date.getDay() (0=Sun ... 6=Sat), each holding that day's sorted
  // "HH:MM" arrival times (hours may run to "24:xx" etc. for trips after
  // midnight). The current GTFS booking period runs 2026-08-09 through
  // 2027-04-03; AC Transit typically republishes a few times a year, so
  // this table should be regenerated from a fresh GTFS feed after that
  // date, or sooner if a user reports it looking off versus the posted
  // AC Transit schedule.

  // Builds a Date for an "HH:MM" schedule time (HH may run past 23 for
  // post-midnight trips) anchored to a given calendar day.
  function scheduleTimeToDate(baseDate, hhmm){
    var parts = hhmm.split(':');
    var d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
    d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
    return d;
  }

  // Returns {line, time}[] of this stop+route's scheduled arrivals for
  // the given calendar day (today or tomorrow), future ones only when
  // onlyFuture is true.
  function scheduledArrivalsForDay(stopId, route, dayDate, onlyFuture){
    var routeTable = SCHEDULE[stopId] && SCHEDULE[stopId][route];
    if (!routeTable) return [];
    var dayTimes = routeTable[dayDate.getDay()] || [];
    var now = Date.now();
    var out = [];
    dayTimes.forEach(function(hhmm){
      var t = scheduleTimeToDate(dayDate, hhmm).getTime();
      if (onlyFuture && t < now) return;
      out.push({ line: route, time: t });
    });
    return out;
  }

  // Combines live tracking (near-term, most accurate) with the
  // scheduled backfill (for the 3rd-8th tile, and tomorrow's first
  // buses once today's are exhausted). Scheduled entries too close to
  // the last live one are dropped as likely the same trip.
  function mergeArrivals(live, stopId, route){
    var today = new Date();
    var tomorrow = new Date(today.getTime() + 24 * 3600 * 1000);
    var scheduled = scheduledArrivalsForDay(stopId, route, today, true)
      .concat(scheduledArrivalsForDay(stopId, route, tomorrow, false));

    var combined = live.slice();
    var cutoff = combined.length ? combined[combined.length - 1].time : Date.now();
    scheduled.forEach(function(item){
      if (item.time > cutoff + 60000) combined.push(item);
    });
    combined.sort(function(a,b){ return a.time - b.time; });
    var deduped = [];
    combined.forEach(function(item){
      if (!deduped.length || (item.time - deduped[deduped.length - 1].time) > 90000){
        deduped.push(item);
      }
    });
    return deduped.slice(0, 8);
  }


  function requestOnce(url){
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.text();
    });
  }

  function fetchStopVisits(stopId){
    var apiUrl = 'https://api.511.org/transit/StopMonitoring?api_key=' + API_KEY +
              '&agency=AC&stopCode=' + stopId + '&format=json';
    // Direct call only -- confirmed 511.org sends proper CORS headers for
    // this endpoint, so no proxy fallback is needed (see note above).
    return requestOnce(apiUrl)
      .then(function(text){
        var clean = text.replace(/^﻿/, '');
        return parseArrivals(JSON.parse(clean));
      });
  }

  function buildPanelSkeleton(entry, idx){
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + idx;

    var header = document.createElement('div');
    header.className = 'panel-header';

    var badge = document.createElement('div');
    badge.className = 'route-badge r' + entry.route;
    badge.textContent = entry.route;
    header.appendChild(badge);

    var loc = document.createElement('div');
    loc.className = 'panel-location';
    var name = document.createElement('p');
    name.className = 'stop-name';
    name.textContent = entry.stop.name;
    var meta = document.createElement('p');
    meta.className = 'stop-meta';
    meta.textContent = entry.distanceM > 600
      ? '距离约 ' + (entry.distanceM / 1000).toFixed(1) + ' 公里'
      : '您现在的位置附近';
    loc.appendChild(name);
    loc.appendChild(meta);
    header.appendChild(loc);

    panel.appendChild(header);

    var body = document.createElement('div');
    body.className = 'panel-body';
    body.id = 'panel-body-' + idx;
    body.innerHTML = '<div class="panel-state"><div class="spinner"></div>正在查询到站时间…</div>';
    panel.appendChild(body);

    return panel;
  }

  function renderPanelBody(idx, list){
    var body = document.getElementById('panel-body-' + idx);
    if (!body) return;
    body.innerHTML = '';
    if (!list.length){
      body.innerHTML = '<div class="panel-state">暂时没有到站信息</div>';
      return;
    }
    var row = document.createElement('div');
    row.className = 'times-row';
    var now = Date.now();
    var todayStr = new Date(now).toDateString();
    list.forEach(function(item){
      var mins = Math.round((item.time - now) / 60000);
      if (mins < 0) mins = 0;

      var tile = document.createElement('div');
      tile.className = 'time-tile';

      var minsEl = document.createElement('div');
      minsEl.className = 'tile-mins' + (mins <= 3 ? ' soon' : '');
      var num = document.createElement('span');
      num.textContent = mins <= 0 ? '进站' : mins;
      minsEl.appendChild(num);
      if (mins > 0){
        var unit = document.createElement('span');
        unit.className = 'unit';
        unit.textContent = '分钟';
        minsEl.appendChild(unit);
      }
      tile.appendChild(minsEl);

      var isTomorrow = new Date(item.time).toDateString() !== todayStr;
      var clockEl = document.createElement('div');
      clockEl.className = 'tile-clock';
      var clockStr = new Date(item.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      clockEl.textContent = isTomorrow ? ('明天 ' + clockStr) : clockStr;
      tile.appendChild(clockEl);

      row.appendChild(tile);
    });
    body.appendChild(row);
  }

  function renderPanelError(idx){
    var body = document.getElementById('panel-body-' + idx);
    if (!body) return;
    body.innerHTML = '<div class="panel-state">连不上实时数据,稍后会自动重试</div>';
  }

  function renderSkeletons(entries){
    els.panels.innerHTML = '';
    entries.forEach(function(entry, idx){
      els.panels.appendChild(buildPanelSkeleton(entry, idx));
    });
  }

    Promise.all(uniqueIds.map(function(id){
      return fetchStopVisits(id).catch(function(){ return null; });
    })).then(function(results){
      var liveCache = {};
      uniqueIds.forEach(function(id, i){
        liveCache[id] = results[i];
      });

      entries.forEach(function(entry, idx){
        var liveVisits = liveCache[entry.stop.id];
        var liveFiltered = liveVisits ? liveVisits.filter(function(v){ return v.line === entry.route; }) : [];
        var combined = mergeArrivals(liveFiltered, entry.stop.id, entry.route);

        if (!combined.length && liveVisits === null){
          renderPanelError(idx);
          return;
        }
        renderPanelBody(idx, combined);
      });

      var now = new Date();
      els.statusLine.textContent = '更新于 ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    });
  }

  function startWith(lat, lon){
    updateLocationText(lat, lon);

    var entries = ROUTES.map(function(route){
      var r = nearestStopForRoute(route, lat, lon);
      return { route: route, stop: r.stop, distanceM: r.distanceM };
    });
    entries.sort(function(a, b){ return a.distanceM - b.distanceM; });
    state.entries = entries;

    renderSkeletons(entries);
    refreshAll();

    if (state.timer) clearInterval(state.timer);
    state.timer = setInterval(refreshAll, REFRESH_MS);
  }

  function onPosition(pos){
    startWith(pos.coords.latitude, pos.coords.longitude);
  }

  function onPositionError(){
    els.statusLine.textContent = '无法获取位置,显示常用的家附近站点';
    els.locationText.textContent = '显示常用地点';
    startWith(STOPS[0].lat, STOPS[0].lon);
  }

  function locate(){
    els.panels.innerHTML = '<div class="panel"><div class="panel-state"><div class="spinner"></div>正在定位,查找附近的公交站…</div></div>';

    if (TEST_LOCATION_OVERRIDE){
      startWith(TEST_LOCATION_OVERRIDE.lat, TEST_LOCATION_OVERRIDE.lon);
      return;
    }
    if (!('geolocation' in navigator)){
      onPositionError();
      return;
    }
    // enableHighAccuracy forces a GPS hardware lock, which can take
    // 5-20+ seconds indoors. Her saved stops are kilometers apart, so
    // the faster, coarser network-based location is plenty precise
    // enough to pick the right one, and it typically returns in 1-3s.
    navigator.geolocation.getCurrentPosition(onPosition, onPositionError, {
      enableHighAccuracy: false,
      timeout: 8000,
      maximumAge: 120000
    });
  }

  els.refreshBtn.addEventListener('click', function(){
    els.refreshBtn.classList.add('spinning');
    locate();
    setTimeout(function(){ els.refreshBtn.classList.remove('spinning'); }, 900);
  });

  locate();

})();
</script>
</body>
</html>
